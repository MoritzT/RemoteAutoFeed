name: Promote v1.1.0 runtime source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-v110.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact v1.1.0 runtime source
        shell: bash
        run: |
          cat .release-v110/main.part01 .release-v110/main.part02 .release-v110/main.part03 .release-v110/main.part04 .release-v110/main.part05 > Scripts/main.lua
          echo "b57af5cc42ff1a9126901387efd28b3d61f03475e582389192d3606b0f348990  Scripts/main.lua" | sha256sum -c -
          echo "2b36badd65b2962ffe99bc72f8c2931b69b043349b0b2eff944b383070b80551  Scripts/config.lua" | sha256sum -c -
          grep -q 'Starting v1.1.0' Scripts/main.lua
          grep -q 'SafetyNetEnabled = true' Scripts/config.lua
          grep -q 'HardMaxRemoteBites = 40' Scripts/config.lua
          ! grep -q 'meal bite limit reached' Scripts/main.lua

      - name: Rebuild v1.1.0 server package
        shell: bash
        run: |
          rm -f dist/RemoteAutoFeed-v1.1.0-server-only.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, re

          root = Path('.')
          out = root / 'dist' / 'RemoteAutoFeed-v1.1.0-server-only.zip'
          files = [
              'CHANGELOG.md', 'LICENSE', 'README.md', 'enabled.txt',
              'Scripts/config.lua', 'Scripts/main.lua'
          ]
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for rel in files:
                  z.write(root / rel, 'RemoteAutoFeed/' + rel)

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          readme = (root / 'README.md').read_text()
          readme = re.sub(
              r'(?s)(SHA-256:\s*```text\s*)[0-9a-f]{64}(\s*```)',
              lambda m: m.group(1) + sha + m.group(2),
              readme,
              count=1,
          )
          (root / 'README.md').write_text(readme)
          print('v1.1.0 package SHA-256:', sha)
          PY

      - name: Commit production source and clean staging files
        shell: bash
        run: |
          rm -rf .release-v110
          rm .github/workflows/promote-v110.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync v1.1.0 runtime source"
          git push
